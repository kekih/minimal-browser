[package]
name = "minimal-browser"
version = "2.0.0"
edition = "2021"
description = "Lightweight optimized browser in Rust with settings and data persistence"
authors = ["kekih <kekih@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/kekih/minimal-browser"

[dependencies]
tao = "0.30"
wry = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
url = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[package.metadata.bundle]
name = "Minimal Browser"
identifier = "com.kekih.minimal-browser"
