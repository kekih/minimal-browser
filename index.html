<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toolbar">
    <button id="back" title="Back">◀</button>
    <button id="forward" title="Forward">▶</button>
    <button id="reload" title="Reload">↻</button>
    <input type="text" id="urlbar" placeholder="Enter URL or search..." spellcheck="false">
    <button id="go" title="Go">→</button>
    <button id="settings-btn" title="Settings">⚙</button>
  </div>

  <div id="settings-panel" class="hidden">
    <h2>Settings</h2>
    <label>Homepage: <input type="text" id="homepage"></label>
    <label>Theme:
      <select id="theme">
        <option value="system">System</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </label>
    <label><input type="checkbox" id="startMaximized"> Start maximized</label>
    <label><input type="checkbox" id="clearOnExit"> Clear data on exit</label>
    <label>Custom CSS (experimental):</label>
    <textarea id="customCSS" rows="4" placeholder="body { ... }"></textarea>
    <div class="buttons">
      <button id="save-settings">Save</button>
      <button id="close-settings">Close</button>
    </div>
    <p class="note">Bitwarden: place unpacked extension in <code>extensions/bitwarden</code> folder next to the app executable (or in source for dev).</p>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
