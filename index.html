<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Minimal Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">
  <div id="toolbar">
    <button id="back" title="Back" type="button">◀</button>
    <button id="forward" title="Forward" type="button">▶</button>
    <button id="reload" title="Reload" type="button">↻</button>
    <input type="text" id="urlbar" placeholder="Enter URL or search..." spellcheck="false" autocomplete="off">
    <button id="go" title="Go" type="button">→</button>
    <button id="settings-btn" title="Settings" type="button">⚙</button>
  </div>

  <div id="settings-backdrop" class="hidden"></div>

  <div id="settings-panel" class="hidden">
    <h2>Settings</h2>
    <label>Homepage
      <input type="text" id="homepage" placeholder="https://duckduckgo.com">
    </label>
    <label>Theme
      <select id="theme">
        <option value="dark" selected>Dark</option>
        <option value="light">Light</option>
        <option value="system">System</option>
      </select>
    </label>
    <label class="checkbox-row"><input type="checkbox" id="startMaximized"> Start maximized</label>
    <label class="checkbox-row"><input type="checkbox" id="clearOnExit"> Clear data on exit</label>
    <label>Custom CSS (experimental)
      <textarea id="customCSS" rows="4" placeholder="body { ... }"></textarea>
    </label>
    <div class="buttons">
      <button id="save-settings" type="button">Save</button>
      <button id="close-settings" type="button">Close</button>
    </div>
    <p class="note">Bitwarden: place unpacked extension in <code>extensions/bitwarden</code> next to the app (or in source for dev).</p>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
